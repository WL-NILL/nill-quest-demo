<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>…</title>
    <style>
      #boot-loading {
        position: fixed;
        z-index: 200;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 44%, #151b1f 0%, #030406 68%);
        color: rgba(219, 222, 220, 0.76);
        transition: opacity 240ms ease, visibility 0s linear 240ms;
      }
      #boot-loading.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loading > div {
        display: grid;
        width: min(78vw, 272px);
        gap: 11px;
      }
      #boot-loading small {
        color: rgba(144, 156, 168, 0.4);
        font: 500 10px/1.2 system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #boot-loading strong {
        font: 400 15px/1.45 Georgia, serif;
      }
      #boot-loading i {
        position: relative;
        display: block;
        height: 1px;
        margin-top: 4px;
        overflow: hidden;
        background: rgba(137, 153, 166, 0.12);
      }
      #boot-loading i::after {
        content: '';
        position: absolute;
        inset-block: 0;
        left: 0;
        width: 38%;
        background: rgba(145, 174, 197, 0.56);
        animation: boot-loading-pass 1450ms cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }
      @keyframes boot-loading-pass {
        from { transform: translateX(-110%); opacity: 0; }
        20% { opacity: 1; }
        to { transform: translateX(270%); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loading i::after { width: 62%; animation: none; }
      }
    </style>
    <script type="module" crossorigin src="/nill-quest-demo/assets/index-Bo_lvSNF.js"></script>
    <link rel="stylesheet" crossorigin href="/nill-quest-demo/assets/index-DHBYj4uh.css">
  </head>
  <body>
    <div id="boot-loading" role="status" aria-live="polite">
      <div>
        <small>загрузка</small>
        <strong>Подготавливаем историю</strong>
        <i aria-hidden="true"></i>
      </div>
    </div>
    <div id="app"></div>
    <noscript>Для запуска истории требуется JavaScript.</noscript>
  </body>
</html>
